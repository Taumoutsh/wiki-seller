services:
  wiki-seller:
    build: .
    restart: unless-stopped
    # MAIL et PASSWORD (et les réglages optionnels) sont lus depuis .env.
    env_file: .env
    environment:
      # Service flaresolverr ci-dessous ; mettre FLARESOLVERR_URL= (vide) dans .env pour s'en passer.
      FLARESOLVERR_URL: ${FLARESOLVERR_URL-http://flaresolverr:8191/v1}
    # Ressources maximales : la moitié du serveur (4 cœurs) et 2 Go de RAM par défaut,
    # réglables dans .env avec CPU_LIMIT et MEM_LIMIT.
    cpus: ${CPU_LIMIT:-2}
    mem_limit: ${MEM_LIMIT:-2g}
    # Chromium utilise /dev/shm ; les 64 Mo par défaut de Docker le font planter.
    shm_size: 512m
    volumes:
      # Cartes protégées et cartes à acheter, modifiables sans reconstruire l'image
      # (relues à chaque passe).
      - ./safed_cards.json:/app/safed_cards.json:ro
      - ./wanted_cards.json:/app/wanted_cards.json:ro
      - ./state:/app/state

  # Essayé quand le site demande une vérification humaine pour les paquets.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
