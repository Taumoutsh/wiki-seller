services:
  wiki-seller:
    build: .
    restart: unless-stopped
    # MAIL et PASSWORD (et les réglages optionnels) sont lus depuis .env.
    env_file: .env
    # Ressources maximales : la moitié du serveur (4 cœurs) et 2 Go de RAM par défaut,
    # réglables dans .env avec CPU_LIMIT et MEM_LIMIT.
    cpus: ${CPU_LIMIT:-2}
    mem_limit: ${MEM_LIMIT:-2g}
    # Chromium utilise /dev/shm ; les 64 Mo par défaut de Docker le font planter.
    shm_size: 512m
    volumes:
      # Fichiers d'état, dont les listes de cartes (state/safe_cards.json, buy_cards.json,
      # sell_cards.json) modifiées par le bot Telegram (/safe, /buy, /sell, /list…).
      - ./state:/app/state
      # Anciennes listes, reprises une fois dans state/ au premier démarrage : ces deux
      # lignes (et les fichiers) seront à supprimer à la prochaine mise à jour.
      - ./safed_cards.json:/app/safed_cards.json
      - ./wanted_cards.json:/app/wanted_cards.json
