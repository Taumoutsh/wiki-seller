services:
  wiki-seller:
    build: .
    restart: unless-stopped
    # Réglages (optionnels) lus depuis .env.
    env_file: .env
    # Ressources maximales, réglables dans .env avec CPU_LIMIT et MEM_LIMIT.
    cpus: ${CPU_LIMIT:-1}
    mem_limit: ${MEM_LIMIT:-512m}
    volumes:
      # Fichiers d'état, dont les listes de cartes (state/safe_cards.json, buy_cards.json,
      # sell_cards.json) modifiées par le bot Telegram (/safe, /buy, /sell, /list…).
      - ./state:/app/state
